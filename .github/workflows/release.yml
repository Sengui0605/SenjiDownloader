name: Build and release SenjiDownloader
on:
  push:
    branches: [main]
    paths: ['SenjiDownloader/**', 'scripts/**', '.github/workflows/release.yml', 'LEEME.txt', 'THIRD-PARTY-NOTICES.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: senji-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable distribution
        shell: pwsh
        run: |
          [xml]$project = Get-Content SenjiDownloader/SenjiDownloader.csproj
          $version = $project.Project.PropertyGroup.Version
          ./scripts/Build.ps1 -Version $version
          "SENJI_VERSION=$version" >> $env:GITHUB_ENV
      - name: Verify real downloads and conversions
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/SenjiDownloader/SenjiDownloader.exe -ArgumentList '--self-test', "$env:RUNNER_TEMP/integration.json" -WindowStyle Hidden -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/integration.json"
          if ($process.ExitCode -ne 0) { throw 'Integration tests failed' }
      - name: Verify dropdown interaction and standalone EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/SenjiDownloader/SenjiDownloader.exe -ArgumentList '--ui-self-test', "$env:RUNNER_TEMP/ui.json" -WindowStyle Hidden -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/ui.json"
          if ($process.ExitCode -ne 0) { throw 'UI regression tests failed' }
          $standalone = "$env:RUNNER_TEMP/standalone"
          New-Item -ItemType Directory -Path $standalone | Out-Null
          Copy-Item ./dist/SenjiDownloader/SenjiDownloader.exe $standalone
          $process = Start-Process -FilePath "$standalone/SenjiDownloader.exe" -ArgumentList '--self-test', "$standalone/portable.json" -WindowStyle Hidden -PassThru -Wait
          Get-Content "$standalone/portable.json"
          if ($process.ExitCode -ne 0) { throw 'Standalone EXE verification failed' }
      - name: Publish version after successful verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SENJI_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "Version $tag already published. Increase Version to publish a new update."; exit 0 }
          gh release create $tag ./dist/release/* --target $env:GITHUB_SHA --title "SenjiDownloader $env:SENJI_VERSION" --notes "Ejecutable portable completo para Windows x64. Abre SenjiDownloader.exe sin instalar dependencias. Incluye su runtime y todos los motores, preparados en segundo plano después de mostrar la interfaz. Descargas simultáneas, conversión de medios y actualizaciones automáticas."
